# Same smoke run, but asks LIBERO for depth/segmentation and privileged 3D state.
server:
  url: "ws://localhost:8000"
  timeout: 300


output_dir: "./results/fastwam_libero_smoke_3d"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero.benchmark:LIBEROBenchmark"
    name: "libero_fastwam_smoke_3d"
    episodes_per_task: 1
    max_tasks: 1
    max_steps: 120
    params:
      suite: libero_spatial
      seed: 7
      env_seed: 0
      num_steps_wait: 30
      send_wrist_image: true
      send_state: true
      send_raw_libero_obs: true
      send_privileged_3d: true
      pointcloud_stride: 16
      record_privileged_summary: true
    recording:
      record_video: true
      record_step: true
      step_fields: [reward, done, success, privileged_3d_summary]
      video_fps: 10
